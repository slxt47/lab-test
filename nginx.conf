events { worker_connections 1024; }

http {
    # Globale Proxy-Einstellungen für reibungslosen HTTP-Betrieb
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Maximale Dateiupload-Größe (wichtig für Nextcloud)
    client_max_body_size 512M;

    # 1. Routing für Nextcloud
    server {
        listen 80;
        server_name nextcloud.*; # Reagiert auf nextcloud.deinedomain.tld

        location / {
            proxy_pass http://nextcloud:80;
        }
    }

    # 2. Routing für Portainer
    server {
        listen 80;
        server_name portainer.*; # Reagiert auf portainer.deinedomain.tld

        location / {
            proxy_pass http://portainer:9000;
            proxy_http_version 1.1;                 # Portainer-Konsole nutzt WebSockets
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # 3. Routing für Mailpit Web-Interface (alle Mails der Lab-Dienste)
    server {
        listen 80;
        server_name mail.* mailpit.*; # Reagiert auf mail.deinedomain.tld

        location / {
            proxy_pass http://mailpit:8025;
            proxy_http_version 1.1;                 # Mailpit nutzt WebSockets für Live-Updates
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}