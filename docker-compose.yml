# Lab-Umgebung: alles unter <dienst>.localhost erreichbar (siehe README)
# Passwörter kommen aus .env (Vorlage: .env.example)
services:

  proxy:
    image: nginx:stable-alpine
    container_name: lab_proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80"   # nur lokal; über einen Cloudflare-Tunnel trotzdem von außen erreichbar
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - nextcloud
      - portainer
      - mailpit

  portainer:
    image: portainer/portainer-ce:lts
    container_name: lab_portainer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      # Achtung: Zugriff auf den Docker-Socket = Root auf dem Host. Nur im Lab, nie öffentlich ohne Login davor.
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

  # Fängt alle Mails ab und zeigt sie im Browser (Nachfolger des nicht mehr gepflegten MailHog)
  mailpit:
    image: axllent/mailpit:v1
    container_name: lab_mailpit
    restart: unless-stopped

  nextcloud:
    image: nextcloud:35-apache
    container_name: lab_nextcloud
    restart: unless-stopped
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD in .env setzen}
      NEXTCLOUD_TRUSTED_DOMAINS: localhost nextcloud.*
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAIL_FROM_ADDRESS: nextcloud
      MAIL_DOMAIN: lab.localhost
    volumes:
      - nextcloud_data:/var/www/html
    depends_on:
      - db

  db:
    image: mariadb:lts
    container_name: lab_nextcloud_db
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD in .env setzen}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD in .env setzen}
      MARIADB_DATABASE: nextcloud
      MARIADB_USER: nextcloud
    volumes:
      - db_data:/var/lib/mysql

volumes:
  portainer_data:
  nextcloud_data:
  db_data:
